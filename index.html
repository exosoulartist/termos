# Termos de Uso

*Última atualização: Novembro de 2026*

Ao utilizar o aplicativo **Taquion - Estúdio de escrita**, você concorda com estes Termos de Uso. Leia atenciosamente antes de utilizar a ferramenta.

---

### 1. Descrição do Serviço
**Taquion - Estúdio de escrita** é um aplicativo de bloco de notas pessoal baseado em arquivos de texto. O aplicativo inclui uma funcionalidade opcional de Inteligência Artificial para análise de textos e geração automática de missões (tarefas).
Inicialmente o usuário poderá usar somente algumas funcionalidades do app, mas conforme escreve e cumpre metas e missões, ganhará pontos de experiência necessários para subir de nível e desbloquear novas funcionalidades gratuitamente.

### 2. Uso de Chave Própria de API (BYOK)
- Para utilizar a funcionalidade de Inteligência Artificial, o usuário deve fornecer sua própria chave de API da plataforma **Google Gemini**.
- O usuário é o único e exclusivo responsável pela obtenção, manutenção, limites de cota e eventuais custos associados à sua chave de API junto ao Google.
- O aplicativo não se responsabiliza por bloqueios, falhas de conexão ou interrupções impostas pelo provedor da API.

### 3. Isenção de Responsabilidade sobre Resultados da IA
- As avaliações e missões geradas pela Inteligência Artificial são meras sugestões automatizadas baseadas em modelos probabilísticos de linguagem.
- Não garanto a precisão, utilidade, veracidade ou adequação das sugestões geradas pela IA, inclusive na efetividade dos mecanismos de gameficação.

### 4. Faixa etária
- O aplicativo Taquion - Estúdio de escrita é destinado a usuários com no mínimo 13 anos de idade. O uso de funcionalidades de Inteligência Artificial exige o fornecimento de uma chave de API própria, cuja obtenção está sujeita aos termos e limites de idade estabelecidos pelo provedor do serviço (Google AI Studio / Google Gemini).

### 5. Propriedade Intelectual
- Todo o conteúdo criado e digitado nas anotações pertence exclusivamente ao usuário.
- O código-fonte, design, interface e marcas associadas ao **Taquion - Estúdio de escrita** pertencem ao desenvolvedor.

### 6. Monetização e Custos de Uso
- Esta versão do aplicativo é gratuita, e todas as funcionalidades podem ser desbloqueadas sem qualquer pagamento ao aplicativo ou ao desenvolvedor.
- A única funcionalidade que poderá gerar custos externos é “**Avaliar Capítulo**”, quando utilizada com uma chave de API cuja conta esteja configurada para faturamento no Google AI Studio ou no serviço correspondente do Google. Nessa situação, as chamadas à API poderão gerar cobranças conforme as políticas de preços e faturamento do provedor.
- O aplicativo não cobra assinaturas ou taxas pelo uso dessa funcionalidade, e o desenvolvedor não recebe valores decorrentes das chamadas à API realizadas pelo usuário.
- O usuário é responsável por verificar as configurações de faturamento, os limites de utilização e as eventuais cobranças aplicáveis à sua conta junto ao provedor da API.

### 7. Alterações nestes Termos
Reservo o direito de atualizar estes Termos de Uso a qualquer momento. Alterações significativas serão refletidas nesta página.

### Textão do desenvolvedor:
Ao longo dos últimos 6 anos estive trabalhando no meu primeiro livro. Conforme o projeto crescia, aplicativos e programas de computador convencionais não estavam facilitando organizar e visualizar o conteúdo com facilidade.
Eu precisava de uma ferramenta que permitisse agrupar todos os arquivos numa Wiki centralizada, fácil da exportar, fácil de navegar, que estivesse acessível na palma da mão e que não exigisse o conhecimento técnico de hospedar um site complexo.

Ao longo desta jornada fui percebendo recursos que me faziam falta em outros editores de texto, coisas que me faziam baixar um para cada tipo de uso, então fui implementando.
Chegou ao ponto de preparar o aplicativo para editar o código dentro do próprio aplicativo. Isto trouxe ideias de novas funcionalidades. 

A filosofia de desenvolvimento foi tornar acessível um editor de texto que forneça diversas ferramentas sem "exigir um curso" e sem tornar a preparação do aplicativo uma tarefa maior que a escrita.
A gameficação é uma estratégia experimental para achatar a barreira de aprendizado, enquanto mantém o engajamento.
A progressão e liberação de funções é baseada na utilidade para quem ainda não tem uma rotina de escrita. Por isso funcionalidades cosméticas são liberadas nos níveis mais avançados. 

A ideia não é exportar um livro pronto para imprimir, mas ter suas histórias escritas e seguras. 
Não é apenas para escritores. Você pode anotar suas listas de compras, planos para o futuro e até proteger seus sentimentos mais profundos com uma senha que, se perder, terá o texto selado, intocável até que a computação quântica os una novamente. Tão romântico!

Piadas à parte. Agradeço por ter baixado meu primeiro aplicativo. Te desejo um futuro próspero, seja na escrita criativa ou anotando o que for necessário.
E lembre-se: As desculpas para não começar acabam aqui... XD
Forte abraço, e boa escrita!
